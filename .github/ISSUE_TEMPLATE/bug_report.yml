name: Bug report
description: Report something broken in Promptoire.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Promptoire.

        Please do not paste private prompts, `prompts.json`, `promptoire.config.json`, API keys, screenshots with secrets, or real personal data. Use sample prompts instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem in a few sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Use sample data only.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, Python version, install method, and whether you are running from source or a build.
      placeholder: "Windows 11, Python 3.12, source checkout"
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private prompts, API keys, config files, and personal data from this report.
          required: true
