<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promptoire</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <div class="title">
            <span class="brain-icon">🧠</span>
            <span class="title-text">Promptoire</span>
        </div>
        <div class="header-buttons">
            <button id="settingsBtn" class="icon-btn" title="Settings">⚙️</button>
            <button id="addBtn" class="icon-btn" title="Add Prompt">➕</button>
        </div>
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="🔍 Search prompts..." autocomplete="off">
        <button id="clearSearch" class="clear-btn" style="display: none;">✖</button>
    </div>

    <div class="content">
        <div id="promptsList" class="prompts-list">
            <!-- Prompts will be dynamically loaded here -->
        </div>
        
        <div id="emptyState" class="empty-state" style="display: none;">
            <div class="empty-icon">📝</div>
            <div class="empty-text">No prompts found</div>
            <div class="empty-subtext">Try adjusting your search or add new prompts</div>
        </div>
    </div>

    <div class="footer">
        <button id="manageBtn" class="footer-btn">📝 Manage Prompts</button>
        <button id="exportBtn" class="footer-btn">📤 Export</button>
    </div>

    <!-- Copy notification -->
    <div id="copyNotification" class="copy-notification">
        <span class="copy-icon">✅</span>
        <span class="copy-text">Copied to clipboard!</span>
    </div>

    <!-- Loading state -->
    <div id="loadingState" class="loading-state">
        <div class="spinner"></div>
        <div class="loading-text">Loading prompts...</div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
